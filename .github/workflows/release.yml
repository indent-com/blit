name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  verify-tag:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Verify tag signature via GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"
          state=$(gh api "repos/${repo}/git/ref/tags/${tag}" \
            --jq '.object.sha' \
            | xargs -I{} gh api "repos/${repo}/git/tags/{}" \
              --jq '.verification.verified')
          if [ "$state" != "true" ]; then
            echo "::error::Tag ${tag} is not signed by a verified identity"
            exit 1
          fi

  build-packages:
    needs: [verify-tag]
    uses: ./.github/workflows/_build-packages.yml
    with:
      upload: true

  build-windows:
    needs: [verify-tag]
    uses: ./.github/workflows/_build-windows.yml
    with:
      upload: true

  # Wasm is architecture-independent, so one leg builds the extension modules
  # every platform's release points at.
  build-extensions:
    needs: [verify-tag]
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: ./bin/extensions
      - uses: actions/upload-artifact@v7
        with:
          name: extensions
          path: |
            extensions/dist/*.wasm
            extensions/dist/manifest.json

  release:
    needs: [build-packages, build-windows, build-extensions]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: debs-*
          merge-multiple: true
          path: debs

      - uses: actions/download-artifact@v8
        with:
          pattern: tarballs-*
          merge-multiple: true
          path: tarballs

      - uses: actions/download-artifact@v8
        with:
          name: windows-x86_64
          path: windows

      - uses: actions/download-artifact@v8
        with:
          name: extensions
          path: extensions

      - name: List artifacts
        run: |
          ls -lh debs/
          ls -lh tarballs/
          ls -lh windows/
          ls -lh extensions/

      # Release assets are the durable home for a module: Pages only ever
      # serves the current release, so a `#digest` pin outlives its version
      # here and nowhere else.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            debs/*.deb
            tarballs/*.tar.gz
            windows/*.zip
            extensions/*.wasm
            extensions/manifest.json
          generate_release_notes: true

  publish-crates:
    needs: [release]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: ./bin/publish-crates
        env:
          # Required only to bootstrap crates which do not exist on crates.io yet.
          # Once their trusted publishers are configured, OIDC is used instead.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-npm:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: ./bin/publish-npm-packages --provenance --access public

  publish-bin-npm:
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # npm >= 11.5 is required for OIDC trusted publishing; Node 22 ships npm 10.
      - run: npm install -g npm@latest

      - uses: actions/download-artifact@v8
        with:
          pattern: tarballs-*
          merge-multiple: true
          path: artifacts

      - uses: actions/download-artifact@v8
        with:
          name: windows-x86_64
          path: artifacts

      - name: Build blit-bin npm packages
        run: ./bin/build-npm-bin-packages artifacts dist/npm-bin "${GITHUB_REF_NAME#v}"

      - name: Publish blit-bin npm packages
        run: ./bin/publish-npm-bin-packages dist/npm-bin --provenance --access public

  update-homebrew:
    needs: [release]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Update Homebrew tap
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: indent-com/homebrew-tap
          event-type: update
          client-payload: '{"version": "${{ github.ref_name }}"}'

  apt-repo:
    needs: [build-packages, build-windows, build-extensions]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: debs-*
          merge-multiple: true
          path: debs

      - uses: actions/download-artifact@v8
        with:
          pattern: tarballs-*
          merge-multiple: true
          path: tarballs

      - uses: actions/download-artifact@v8
        with:
          name: windows-x86_64
          path: windows

      - uses: actions/download-artifact@v8
        with:
          name: extensions
          path: extensions

      - name: Import GPG key
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Build APT repo
        run: |
          sudo apt-get update && sudo apt-get install -y dpkg-dev

          mkdir -p repo/pool repo/dists/stable/main/binary-amd64
          mkdir -p repo/dists/stable/main/binary-arm64
          cp debs/*.deb repo/pool/
          cp .github/blit.gpg repo/blit.gpg

          # Static binaries for direct download
          mkdir -p repo/bin
          for f in tarballs/*.tar.gz; do
            cp "$f" repo/bin/
          done
          for f in windows/*.zip; do
            cp "$f" repo/bin/
          done

          # Extension modules, for `blit ext run https://install.blit.sh/ext/…`.
          # Like repo/bin, this is the current release only: Pages publishes
          # the tree wholesale, so an older module's URL stops resolving. The
          # manifest carries each module's BLAKE3, which is what a `#digest`
          # pin needs and what the GitHub Release keeps forever.
          mkdir -p repo/ext
          cp extensions/*.wasm repo/ext/
          cp extensions/manifest.json repo/ext/manifest.json

          # Write version to /latest
          echo "${GITHUB_REF_NAME#v}" > repo/latest

          cp install.sh repo/index.html
          cp install.ps1 repo/install.ps1
          cp SKILL.md repo/SKILL.md

          cd repo
          dpkg-scanpackages --arch amd64 pool > dists/stable/main/binary-amd64/Packages
          dpkg-scanpackages --arch arm64 pool > dists/stable/main/binary-arm64/Packages
          gzip -k dists/stable/main/binary-amd64/Packages
          gzip -k dists/stable/main/binary-arm64/Packages

          cat > dists/stable/Release <<'RELEASE'
          Origin: blit
          Label: blit
          Suite: stable
          Codename: stable
          Architectures: amd64 arm64
          Components: main
          RELEASE
          sed -i 's/^          //' dists/stable/Release

          apt-ftparchive release dists/stable >> dists/stable/Release
          gpg --batch --yes --armor --detach-sign --output dists/stable/Release.gpg dists/stable/Release
          gpg --batch --yes --armor --clearsign --output dists/stable/InRelease dists/stable/Release

      - uses: actions/upload-pages-artifact@v5
        with:
          path: repo

  deploy-pages:
    needs: [apt-repo]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/deploy-pages@v5
