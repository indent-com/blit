name: Build packages

on:
  workflow_call:
    inputs:
      upload:
        type: boolean
        default: false
      macos:
        type: boolean
        default: true

jobs:
  build-packages:
    strategy:
      matrix:
        # A matrix cannot be filtered by an input, so each variant is spelled out
        # as a JSON literal. The macOS runner costs ~10x the Linux ones per
        # minute, so callers that only need a compile check leave it out.
        include: ${{ fromJSON(inputs.macos && '[{"runner":"blacksmith-16vcpu-ubuntu-2404","label":"linux-x86_64","arch":"amd64","debs":true},{"runner":"blacksmith-16vcpu-ubuntu-2404-arm","label":"linux-aarch64","arch":"arm64","debs":true},{"runner":"blacksmith-12vcpu-macos-latest","label":"macos-aarch64","debs":false}]' || '[{"runner":"blacksmith-16vcpu-ubuntu-2404","label":"linux-x86_64","arch":"amd64","debs":true},{"runner":"blacksmith-16vcpu-ubuntu-2404-arm","label":"linux-aarch64","arch":"arm64","debs":true}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: ./bin/build-tarballs dist
        env:
          # The macOS runner has less headroom than Linux and has OOM-killed
          # the pnpm dependency fetch derivation under unrestricted Nix
          # parallelism (exit 137). Keep this build bounded; Linux packaging is
          # still dominated by cached Cargo artifacts.
          NIX_CONFIG: |
            max-jobs = 2
            cores = 4
      - run: ./bin/build-debs debs
        if: ${{ matrix.debs }}
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.upload }}
        with:
          name: tarballs-${{ matrix.label }}
          path: dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.upload && matrix.debs }}
        with:
          name: debs-${{ matrix.arch }}
          path: debs/*.deb
