version: "0.5"

# All ports and paths are set by bin/dev via environment variables.
# See bin/dev for the BLIT_DEV_INSTANCE mechanism that makes it easy to
# run multiple stacks side-by-side.
#
#   BLIT_DEV_SOCK       blit server Unix socket    (default: /tmp/blit-dev.sock)
#   BLIT_DEV_UI_PORT    Vite UI dev-server port    (default: 10000)
#   BLIT_DEV_GW_PORT    Gateway WS/WT port          (default: 10001)
#   BLIT_DEV_GW_HOST    Gateway TCP/UDP bind host   (default: 127.0.0.1)
#   BLIT_DEV_SITE_PORT  Astro website dev port     (default: 10002)
#   BLIT_DEV_EXT_PORT   Extension registry port    (default: 10003)
#   BLIT_DEV_WT_ADDR    Browser-facing WT authority (default: :10001)
#
# BLIT_DEV_CARGO_FLAGS adds cargo flags to the blit build — e.g. put
#   export BLIT_DEV_CARGO_FLAGS="--features x264"
# in .env.local to compile both software H.264 encoders, then pick one at
# runtime with BLIT_H264_SOFTWARE=x264|openh264 (see docs/server.md).

processes:
  build:
    # Stub the js/ui/dist assets on fresh checkouts so cargo can compile
    # blit-gateway / blit-cli (they embed each one via include_bytes!).
    # Vite only writes the `.br` files on a production build (`vite build`);
    # the `ui` process runs the dev server, so nothing in this stack produces
    # them otherwise.  Every asset the Rust side embeds has to be listed here
    # — a missing one fails the build with a bare "couldn't read" — so keep
    # this list and bin/dev-check's in step with the include_bytes! calls in
    # crates/gateway/src/lib.rs and crates/cli/src/interactive.rs.  Content
    # doesn't matter: at runtime the dev UI is served from the vite dev
    # server, not these embedded blobs.
    command: >-
      mkdir -p js/ui/dist;
      for asset in index.html sw.js mux-worker.js buffer-recycler-worker.js; do
      if [ ! -f "js/ui/dist/$asset.br" ]; then
      case "$asset" in
      *.html) echo '<html><body>stub</body></html>' > "js/ui/dist/$asset";;
      *) echo '/* stub */' > "js/ui/dist/$asset";;
      esac;
      python3 -c "import brotli, pathlib, sys; p = pathlib.Path(sys.argv[1]); pathlib.Path(str(p) + '.br').write_bytes(brotli.compress(p.read_bytes()))" "js/ui/dist/$asset" 2>/dev/null || cp "js/ui/dist/$asset" "js/ui/dist/$asset.br";
      fi;
      done;
      exec cargo build -p blit-cli --profile profiling ${BLIT_DEV_CARGO_FLAGS:-}

  browser-wasm:
    command: cargo watch -w crates/browser/src -w crates/remote/src -s "cd crates/browser && wasm-pack build --target web --release --out-dir pkg"
    availability:
      restart: always
    readiness_probe:
      exec:
        command: test -f crates/browser/pkg/blit_browser.js
      period_seconds: 2
      failure_threshold: 300

  js-deps:
    command: cd js && pnpm install --frozen-lockfile
    depends_on:
      browser-wasm:
        condition: process_healthy

  server:
    # Remove the stale socket *before* starting the server.  The old
    # server's UnixListener::drop does not unlink the socket file, so
    # without this the readiness probe (`test -S`) gives a false
    # positive while the new server is still spawning its compositor
    # and audio pipeline — causing dependents (gateway, share) to
    # connect to a dead socket and enter a restart loop.
    # --allow-persistent-extensions so `blit ext run --persist` works here.
    # Without it an extension still runs, but nothing registers its `@name`
    # commands, which shows up as `blit ext commands` being silently empty.
    # The catalog path is per instance so two dev stacks cannot fight over one
    # redb file -- the loser of that race gets no extension subsystem at all.
    command: rm -f ${BLIT_DEV_SOCK:-/tmp/blit-dev.sock} && exec ./target/profiling/blit server --verbose --socket ${BLIT_DEV_SOCK:-/tmp/blit-dev.sock} --allow-persistent-extensions
    environment:
      - "BLIT_EXTENSION_PATH=${BLIT_DEV_EXT_DB:-/tmp/blit-dev-ext/extensions.redb}"
    depends_on:
      build:
        condition: process_completed_successfully
    availability:
      # on_failure (not "always") so a graceful SIGTERM exit (code 0)
      # does not trigger an automatic restart.  With "always", the
      # flock-based server replacement (ipc_unix.rs) can create a
      # restart loop: the old server exits 0, process-compose
      # auto-starts another, which kills the replacement, etc.
      restart: on_failure
      backoff_seconds: 2
      max_restarts: 5
    readiness_probe:
      exec:
        command: test -S ${BLIT_DEV_SOCK:-/tmp/blit-dev.sock}
      period_seconds: 2
      failure_threshold: 300
    shutdown:
      # SIGTERM gives the server time to broadcast S2C_QUIT to clients
      # and run AudioPipeline::drop (which kills dbus/pipewire/pw-cat
      # children in order).  15 s is generous — normal shutdown takes
      # < 1 s, but a slow audio teardown can take a few seconds.
      signal: 15
      timeout_seconds: 15

  gateway:
    command: ./target/profiling/blit gateway
    environment:
      - BLIT_ADDR=${BLIT_DEV_GW_HOST:-127.0.0.1}:${BLIT_DEV_GW_PORT:-10001}
      # Set BLIT_AUDIO_DEBUG=1 here and on the server to localise an audio
      # gap to one hop: the server reports its own writer, the gateway
      # reports both the socket to the browser and what it reads upstream.
      # Off by default — it is a line per second per channel.
      - BLIT_CORS=*
      - BLIT_GATEWAY_WEBRTC=${BLIT_GATEWAY_WEBRTC:-0}
      - BLIT_PASSPHRASE=${BLIT_PASSPHRASE:-dev}
      - BLIT_PROXY=0
      - BLIT_QUIC=1
      - BLIT_QUIC_PUBLIC_ADDR=${BLIT_DEV_WT_ADDR:-:${BLIT_DEV_GW_PORT:-10001}}
      - BLIT_SOCK=${BLIT_DEV_SOCK:-/tmp/blit-dev.sock}
      - BLIT_STORE_CONFIG=1
    depends_on:
      build:
        condition: process_completed_successfully
      server:
        condition: process_healthy
    availability:
      restart: always
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: ${BLIT_DEV_GW_PORT:-10001}
        path: /
      period_seconds: 2
      failure_threshold: 300

  share:
    command: >-
      if [ -z "${BLIT_DEV_SHARE:-}" ]; then exit 0; fi;
      exec ./target/profiling/blit share --quiet
    environment:
      - BLIT_SOCK=${BLIT_DEV_SOCK:-/tmp/blit-dev.sock}
      - BLIT_PROXY=0
    depends_on:
      build:
        condition: process_completed_successfully
      server:
        condition: process_healthy
    availability:
      restart: on_failure

  ui:
    command: cd js/ui && pnpm exec vite --host --port ${BLIT_DEV_UI_PORT:-10000}
    environment:
      - BLIT_DEV_GW_PORT=${BLIT_DEV_GW_PORT:-10001}
    depends_on:
      js-deps:
        condition: process_completed_successfully
    availability:
      restart: always

  # The stack's own https://install.blit.sh/ext: build every extension to
  # extensions/dist, then serve that directory with CORS open. The UI's
  # Extensions panel defaults to this registry under `vite dev`, so installing
  # what you just edited takes no URL typing and no network.
  #
  # Rebuilds are not watched: a wasm rebuild is a minute of wall clock, and
  # having it fire on every keystroke in extensions/ would be worse than
  # re-running `bin/extensions` when you mean it. The server re-reads the
  # directory per request, so a manual rebuild is picked up without a restart.
  extensions:
    command: ./bin/extensions && exec ./bin/ext-registry ${BLIT_DEV_EXT_PORT:-10003}
    availability:
      restart: on_failure
      backoff_seconds: 5
      max_restarts: 3
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: ${BLIT_DEV_EXT_PORT:-10003}
        path: /manifest.json
      period_seconds: 2
      failure_threshold: 300

  website:
    command: cd js/website && pnpm exec astro dev --host --port ${BLIT_DEV_SITE_PORT:-3267}
    depends_on:
      js-deps:
        condition: process_completed_successfully
    availability:
      restart: always
