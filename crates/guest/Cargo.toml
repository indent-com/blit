[package]
name = "blit-guest"
version = "0.54.0"
edition.workspace = true
description = "Guest SDK for Blit Wasmi extensions"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["protocol"]
# Re-export the complete Blit packet codec. Disable default features when an
# alloc-only guest wants just the host ABI, bootstrap, and collection support.
protocol = ["dep:blit-remote"]

[dependencies]
blit-remote = { workspace = true, optional = true }
getrandom = { version = "=0.2.17", default-features = false, features = ["custom"] }
hashbrown = { version = "0.16", default-features = false }
siphasher = { version = "1", default-features = false }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[[example]]
name = "command_provider"
required-features = ["protocol"]

[[example]]
name = "terminal_subscription"
required-features = ["protocol"]
