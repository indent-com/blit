[package]
name = "blit-server"
version = "0.42.1"
edition.workspace = true
description = "blit terminal multiplexer server"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "blit_server"
path = "src/lib.rs"

[features]
# Software H.264 encoders for compositor surface streaming (Linux-only, see
# surface_encoder.rs). Independent build-time choices: build with either,
# both (x264 preferred, openh264 as runtime fallback), or neither (software
# fallback is then AV1-only). x264 is GPL-2.0-or-later, which governs
# distribution of binaries that include it — that's why it is off by
# default and an explicit opt-in for releases (see `blit --license`).
default = ["openh264"]
x264 = ["dep:x264-sys"]
openh264 = ["dep:openh264"]

[dependencies]
blit-remote = { workspace = true }
blit-fssync = { workspace = true }
blit-git = { workspace = true }
blit-lsp = { workspace = true }
blit-alacritty = { workspace = true }
blit-compositor = { workspace = true }
blit-sd-notify = { workspace = true }
tokio = { version = "1", features = ["full"] }
# Opt-in TLS termination for relayed streams (docs/design/net.md § TLS
# termination). Same versions the cli, webrtc-forwarder and upsidedown
# crates already pin, so nothing new enters the workspace.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
] }
rustls-native-certs = "0.8"
ignore = "0.4"
regex = "1"
memchr = "2"
getrandom = "0.3"
redb = "2"
rav1e = { version = "0.8", default-features = false }
ravif = { version = "0.13", default-features = false }
rgb = "0.8"
png = "0.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
opus = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
# Software H.264 encoders, enabled by the features of the same names.
# Linux-only: the compositor that feeds the software H.264 surface encoder
# only exists on Linux (see surface_encoder.rs). x264-sys links the system
# libx264 via pkg-config; openh264 compiles its bundled source.
x264-sys = { version = "0.2", optional = true }
openh264 = { version = "0.9", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }
