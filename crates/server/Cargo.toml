[package]
name = "blit-server"
version = "0.41.2"
edition.workspace = true
description = "blit terminal multiplexer server"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "blit_server"
path = "src/lib.rs"

[dependencies]
blit-remote = { workspace = true }
blit-fssync = { workspace = true }
blit-git = { workspace = true }
blit-lsp = { workspace = true }
blit-alacritty = { workspace = true }
blit-compositor = { workspace = true }
blit-sd-notify = { workspace = true }
tokio = { version = "1", features = ["full"] }
# Opt-in TLS termination for relayed streams (docs/design/net.md § TLS
# termination). Same versions the cli, webrtc-forwarder and upsidedown
# crates already pin, so nothing new enters the workspace.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
] }
rustls-native-certs = "0.8"
ignore = "0.4"
regex = "1"
memchr = "2"
getrandom = "0.3"
redb = "2"
openh264 = "0.9"
rav1e = { version = "0.8", default-features = false }
ravif = { version = "0.13", default-features = false }
rgb = "0.8"
png = "0.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
opus = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }
