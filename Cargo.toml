[workspace]
resolver = "3"
members = [
    "crates/guest",
    "crates/remote",
    "crates/fssync",
    "crates/git",
    "crates/lsp",
    "crates/alacritty-driver",
    "crates/server",
    "crates/gateway",
    "crates/upsidedown",
    "crates/browser",
    "crates/cli",
    "crates/fonts",
    "crates/webserver",
    "crates/webrtc-forwarder",
    "crates/compositor",
    "crates/proxy",
    "crates/sd-notify",
    "crates/ssh",
    "crates/desktop",
]
# A path dependency living under the workspace root would otherwise become an
# implicit member, so `--workspace` clippy/test/fmt runs would lint, test, and
# reformat third-party code we only consume.
exclude = ["vendor/cros-codecs"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/indent-com/blit"
homepage = "https://blit.sh"

[workspace.dependencies]
blit-guest = { version = "0.52.0", path = "crates/guest" }
blit-remote = { version = "0.52.0", path = "crates/remote" }
blit-fssync = { version = "0.52.0", path = "crates/fssync" }
blit-git = { version = "0.52.0", path = "crates/git" }
blit-lsp = { version = "0.52.0", path = "crates/lsp" }
blit-alacritty = { version = "0.52.0", path = "crates/alacritty-driver" }
blit-fonts = { version = "0.52.0", path = "crates/fonts" }
blit-webserver = { version = "0.52.0", path = "crates/webserver" }
blit-server = { version = "0.52.0", path = "crates/server", default-features = false }
blit-gateway = { version = "0.52.0", path = "crates/gateway" }
blit-proxy = { version = "0.52.0", path = "crates/proxy" }
blit-webrtc-forwarder = { version = "0.52.0", path = "crates/webrtc-forwarder" }
blit-compositor = { version = "0.52.0", path = "crates/compositor" }
blit-sd-notify = { version = "0.52.0", path = "crates/sd-notify" }
blit-ssh = { version = "0.52.0", path = "crates/ssh" }
blit-desktop = { version = "0.52.0", path = "crates/desktop" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.profiling]
inherits = "release"
debug = true
strip = false
lto = false
codegen-units = 16
